apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-portal
  namespace: roadsphere-demo
  labels:
    app.kubernetes.io/name: customer-portal
    app.kubernetes.io/part-of: roadsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-portal
        app.kubernetes.io/part-of: roadsphere
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: roadsphere/customer-portal:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: customer-portal
  namespace: roadsphere-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: customer-portal
  ports:
    - name: http
      port: 5174
      targetPort: http
